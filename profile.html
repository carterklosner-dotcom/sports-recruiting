<!DOCTYPE html>
<html>
<head>
  <title>Player Profile</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .profile-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .top img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ddd;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
    }

    .info {
      margin-top: 10px;
      color: gray;
    }

    .stats {
      margin-top: 15px;
      font-size: 16px;
    }

    .upload {
      margin-top: 20px;
    }

    .videos {
      margin-top: 20px;
    }

    video {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="profile-card">

  <div class="top">
    <img id="profilePic" src="">
    <div>
      <div class="name" id="name"></div>
      <div class="info" id="school"></div>
      <div class="info" id="position"></div>
    </div>
  </div>

  <div class="stats">
    <p id="height"></p>
    <p id="weight"></p>
  </div>

  <div class="upload">
    <input type="file" id="videoUpload" accept="video/*">
    <br><br>
    <button onclick="addVideo()">Add Film</button>
  </div>

  <div class="videos" id="videoList"></div>

</div>

<script>
  const player = JSON.parse(localStorage.getItem("selectedPlayer"));

  document.getElementById("name").innerText = player.name;
  document.getElementById("school").innerText = player.school;
  document.getElementById("position").innerText = player.position || "";
  document.getElementById("height").innerText = "Height: " + (player.height || "");
  document.getElementById("weight").innerText = "Weight: " + (player.weight || "");

  // profile pic
  if (player.photo) {
    document.getElementById("profilePic").src = player.photo;
  } else {
    document.getElementById("profilePic").src = "https://via.placeholder.com/90";
  }

  // load videos
  let videos = JSON.parse(localStorage.getItem("videos")) || [];
  const videoList = document.getElementById("videoList");

  function renderVideos() {
    videoList.innerHTML = "";
    videos.forEach((vid) => {
      const video = document.createElement("video");
      video.src = vid;
      video.controls = true;
      videoList.appendChild(video);
    });
  }

  renderVideos();

  function addVideo() {
    const file = document.getElementById("videoUpload").files[0];

    if (!file) {
      alert("Upload a video first");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      videos.push(e.target.result);
      localStorage.setItem("videos", JSON.stringify(videos));
      renderVideos();
    };

    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
